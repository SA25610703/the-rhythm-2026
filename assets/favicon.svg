<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbe2a7" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#e59866" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#140e0a" />
  <g filter="url(#goldGlow)">
    <!-- Microphone Head -->
    <rect x="24" y="10" width="16" height="22" rx="8" fill="url(#goldGrad)" />
    <!-- Microphone Grille lines -->
    <line x1="24" y1="17" x2="40" y2="17" stroke="#140e0a" stroke-width="1.5" />
    <line x1="24" y1="24" x2="40" y2="24" stroke="#140e0a" stroke-width="1.5" />
    <!-- Stand / Handle -->
    <rect x="29" y="32" width="6" height="14" rx="2" fill="url(#goldGrad)" />
    <!-- Rhythm Soundwaves -->
    <path d="M 14 26 Q 10 32 14 38" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 50 26 Q 54 32 50 38" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>
</svg>
