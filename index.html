<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Rhythm 2026 | Countdown</title>
  
  <!-- Meta & OpenGraph -->
  <meta name="description" content="Countdown to The Rhythm 2026 (ரிதம்) - Rhythm Karaoke Night. Starts today at 5:00 PM!">
  <meta property="og:title" content="The Rhythm 2026 (ரிதம்) - Countdown">
  <meta property="og:description" content="Rhythm Karaoke Night - Starts today at 5:00 PM!">
  <meta property="og:image" content="assets/background.jpg">
  <meta property="og:type" content="website">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="minimal-layout">

  <!-- Official Poster Background Layers -->
  <div class="poster-bg-layer" id="poster-bg"></div>
  <div class="poster-vignette"></div>

  <!-- Ambient Soundwave & Particle Canvas -->
  <canvas id="bg-canvas"></canvas>

  <!-- Top Minimal Bar -->
  <header class="minimal-header">
    <div class="header-brand">
      <!-- <img src="assets/favicon.svg" alt="Rhythm Logo" class="brand-icon"> -->
      <span class="brand-name event-name-text">THE RHYTHM 2026</span>
    </div>

    <!-- Optional Ambient Beat Toggle -->
    <button class="btn-sound" id="sound-toggle" title="Toggle Acoustic Beat" aria-label="Toggle Acoustic Beat">
      <span class="sound-indicator"></span>
      <span class="sound-label">Beat: OFF</span>
    </button>
  </header>

  <!-- Pure Countdown Centered Container -->
  <main class="countdown-wrapper">
    <div class="container countdown-content">
      
      <!-- Top Subtitle / Organizer Badge -->
      <div class="hero-badge">
        <span class="badge-glow"></span>
        <span class="university-text">NORTHERN UNI Student Community</span>
      </div>

      <div class="hero-sub-header">Rhythm Karaoke Night</div>

      <!-- Tamil Calligraphy Title from Poster -->
      <div class="tamil-hero-title">
        <img src="assets/tamil-title.png" alt="ரிதம்" class="tamil-title-img">
      </div>

      <!-- English Event Title -->
      <h1 class="hero-title">
        <span class="title-gradient event-name-text">The Rhythm 2026</span>
      </h1>

      <p class="hero-tagline">Starts Today at 5:00 PM</p>

      <!-- Celebration Banner (shown when timer reaches 0) -->
      <div class="celebration-box" id="celebration-section">
        <h2 class="celebration-title">🎤 THE RHYTHM HAS BEGUN! 🎶</h2>
        <p class="celebration-subtitle">The stage is set and the mic is live!</p>
        <button class="btn btn-primary" id="trigger-celebration">🎉 Blast Confetti</button>
      </div>

      <!-- Pure High-Precision Countdown HUD: Hours, Minutes, Seconds -->
      <div class="countdown-container" id="countdown-section">
        <!-- Hours -->
        <div class="countdown-box glass-panel">
          <div class="ring-wrapper">
            <svg class="progress-ring" viewBox="0 0 120 120">
              <circle class="ring-bg" cx="60" cy="60" r="45" stroke-width="6" />
              <circle class="ring-indicator ring-hours" id="ring-hours" cx="60" cy="60" r="45" stroke-width="6" stroke-dasharray="283" stroke-dashoffset="0" transform="rotate(-90 60 60)" />
            </svg>
            <div class="countdown-value" id="count-hours">00</div>
          </div>
          <span class="countdown-label">Hours</span>
        </div>

        <!-- Minutes -->
        <div class="countdown-box glass-panel">
          <div class="ring-wrapper">
            <svg class="progress-ring" viewBox="0 0 120 120">
              <circle class="ring-bg" cx="60" cy="60" r="45" stroke-width="6" />
              <circle class="ring-indicator ring-minutes" id="ring-minutes" cx="60" cy="60" r="45" stroke-width="6" stroke-dasharray="283" stroke-dashoffset="0" transform="rotate(-90 60 60)" />
            </svg>
            <div class="countdown-value" id="count-minutes">00</div>
          </div>
          <span class="countdown-label">Minutes</span>
        </div>

        <!-- Seconds -->
        <div class="countdown-box glass-panel">
          <div class="ring-wrapper">
            <svg class="progress-ring" viewBox="0 0 120 120">
              <circle class="ring-bg" cx="60" cy="60" r="45" stroke-width="6" />
              <circle class="ring-indicator ring-seconds" id="ring-seconds" cx="60" cy="60" r="45" stroke-width="6" stroke-dasharray="283" stroke-dashoffset="0" transform="rotate(-90 60 60)" />
            </svg>
            <div class="countdown-value" id="count-seconds">00</div>
          </div>
          <span class="countdown-label">Seconds</span>
        </div>
      </div>

    </div>
  </main>

  <!-- Scripts: Config, Confetti, Visualizer, App -->
  <script src="config.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/visualizer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
